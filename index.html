<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende ABC</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/card2.css">
    <link rel="stylesheet" href="css/store.css">
</head>

<body>
    <main class="content">
        <section>
            <div class="header">
                <div class="title">
                    <h1>Bem vindo ao Aprende <span class="A">A</span><span class="B">B</span><span class="C">C</span></h1>
                </div>
                <div class="btn-modal info" id="info" onclick="abrirModal('janelaApresentation')">
                    <span class="material-symbols-outlined infoBtn" data-modal-id="infoApresentation" id="info">
                        info
                    </span>
                </div>
            </div>
            <div class="menu">
                <div class="img" id="mascMasc">
                    
                </div>
                <div class="btn-name">
                    <div class="btn">
                        <a href="games.html">
                            <button class="button" onclick="effectSonoro()">
                                Começar o jogo
                            </button>
                        </a>
                    </div>
                </div>
                <div class="img" id="mascFem">
                    
                </div>
            </div>
            <div class="local-btn">
                <div onclick="abrirModal('janelaModal')" class="btn-modal" id="modalPersons">Personagens</div>
            </div>
        </section>
        <footer>
            Desenvolvido por Lucas Paulo &copy; 2024
        </footer>
    </main>
    <!-- Modal -->
    <div id="janelaModal" class="janelaModal">
        <div id="modal" class="modal">
            <div class="top-modal">
                <button class="fechar" id="fechar">X</button>
                <h2>Personagens</h2>
                
            </div>
            <hr>
            <div class="modal-body" id="contentPerson">
                
            </div>
        
        </div>
    </div>

    <div id="janelaApresentation" class="janelaApresentation janelaModal">
        <div id="modal" class="modal modalApresent">
            <div class="top-modal">
                <button class="fechar" id="fechar">X</button>
            </div>
            <div class="modalContent">
                <div id="professorFala">
                    <div id="professorFalaImg">

                    </div>
                    <div id="professorFalaTexto">

                    </div>
                    
                </div>
                <div>
                    <img src="assets/imagens/professor.gif" alt="" height="200px">
                </div>
                <div class="buttonsArrow">
                    <button class="btnArrow">
                        <span class="material-symbols-outlined btnF back" id="btnBack">
                            arrow_back
                        </span>
                    </button>
                    <button class="btnArrow">
                        <span class="material-symbols-outlined btnF next" id="btnNext">
                        arrow_forward
                        </span>
                    </button>
                </div>
            </div>
            
        </div>
    </div>


    <script src="js/openModais.js"></script>
    <script src="js/main.js"></script>
    <script src="js/buyPerson.js"></script>
    
    
</body>

</html>
